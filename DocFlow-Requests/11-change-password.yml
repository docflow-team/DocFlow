info:
  name: Change Password
  type: http
  seq: 11
http:
  method: PUT
  url: '{{baseUrl}}/api/v1/auth/password'
  headers:
  - name: Authorization
    value: Bearer {{accessToken}}
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |
      {
        "currentPassword": "replace-locally",
        "newPassword": "replace-locally-with-new-password"
      }
