info:
  name: Replace document metadata
  type: http
  seq: 5
http:
  method: PUT
  url: '{{baseUrl}}/api/v1/documents/{{documentId}}/metadata'
  headers:
  - name: Authorization
    value: Bearer {{accessToken}}
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |
      {
        "title": "October invoice",
        "description": null
      }
docs: PUT replaces title and description; null clears description. Original PDF content and filename are immutable.
