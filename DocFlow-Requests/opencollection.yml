opencollection: 1.0.0
info:
  name: DocFlow-Requests
request:
  headers:
  - name: Accept
    value: application/json
bundled: false
extensions:
  ignore:
  - node_modules
  - .git
docs: Use Local. Run Login with local credentials; its token is captured only as a
  runtime variable. Change a temporary password, then log in again. Protected requests
  use accessToken. Metadata belongs to the logged-in user; shared type creation requires
  ADMIN. PDF upload is not implemented yet. Do not save real passwords or tokens.
  See README and contracts/openapi.yaml for implemented behavior.
