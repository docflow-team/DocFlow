# Run explicitly against an initialized API database; never recreate its tables here.
spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=validate
spring.main.banner-mode=off

docflow.bootstrap.username=${DOCFLOW_BOOTSTRAP_USERNAME:}
docflow.bootstrap.email=${DOCFLOW_BOOTSTRAP_EMAIL:}
docflow.bootstrap.password=${DOCFLOW_BOOTSTRAP_PASSWORD:}
