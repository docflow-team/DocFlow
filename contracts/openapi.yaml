openapi: 3.1.0
info:
  title: DocFlow API
  version: sprint-2-task-9
  description: Authentication, account creation, owner-only PDF management and seeded
    manual categories. Background processing is unavailable.
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      summary: Public health check
      responses:
        '200':
          description: Public health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /api/v1/auth/login:
    post:
      summary: Log in with username or email
      responses:
        '200':
          description: Log in with username or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid login or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/me:
    get:
      summary: Read current account
      responses:
        '200':
          description: Read current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid login or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Role or temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/logout:
    post:
      summary: Revoke all current account tokens
      responses:
        '204':
          description: Revoke all current account tokens
        '401':
          description: Invalid login or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Role or temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      description: Also available to temporary-password accounts.
  /api/v1/auth/password:
    put:
      summary: Change password and revoke tokens
      responses:
        '204':
          description: Change password and revoke tokens
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid login or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Role or temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      description: Also available to temporary-password accounts. Log in again after
        success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
  /api/v1/admin/users:
    post:
      summary: Create an account (ADMIN only)
      description: Requires an enabled administrator who has changed their temporary
        password. Creates an enabled USER or ADMIN with mustChangePassword=true. Identifiers
        are trimmed/lowercased; passwords are never normalized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created account; password change required before document access
          headers:
            Location:
              description: Identifier URI of the created account
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid identifiers, role or temporary password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Administrator access or password change required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Username/email already exists or a database constraint prevents
            creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/documents:
    post:
      summary: Upload an unencrypted PDF containing 1-50 pages
      responses:
        '202':
          description: Upload an unencrypted PDF containing 1-50 pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
          headers:
            Location:
              description: Relative processing-status URL
              schema:
                type: string
        '400':
          description: Invalid request or PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: PDF exceeds 10 MiB or multipart request exceeds 12 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Document storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      description: Stores synchronously; 202 does not indicate queued work. All processing
        stages are NOT_STARTED.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            encoding:
              file:
                contentType: application/pdf
    get:
      summary: List own PDFs, newest first with ID as tie-breaker
      responses:
        '200':
          description: List own PDFs, newest first with ID as tie-breaker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
        '400':
          description: Invalid request or PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
  /api/v1/documents/{id}:
    parameters:
    - &id001
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      summary: Read own PDF metadata
      responses:
        '200':
          description: Read own PDF metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete own PDF and metadata
      responses:
        '204':
          description: Delete own PDF and metadata
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/documents/{id}/metadata:
    parameters:
    - *id001
    put:
      summary: Replace title and description
      responses:
        '200':
          description: Replace title and description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Invalid request or PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataRequest'
  /api/v1/documents/{id}/content:
    parameters:
    - *id001
    get:
      summary: Download own PDF attachment
      responses:
        '200':
          description: Download own PDF attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment with original basename
            Cache-Control:
              schema:
                const: no-store
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Document storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/documents/{id}/processing:
    parameters:
    - *id001
    get:
      summary: Read inactive processing status
      responses:
        '200':
          description: Read inactive processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/categories:
    get:
      summary: List shared categories, sorted by name
      responses:
        '200':
          description: Seeded definitions and retained legacy categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Invalid login or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Role or temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/documents/{id}/categories:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: Replace own document category assignments
      description: All IDs must be known, positive and unique. Invalid input leaves
        existing assignments unchanged. An empty array clears assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesRequest'
      responses:
        '200':
          description: Updated document with readable categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Invalid, duplicate or unknown category IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Temporary-password restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Document not found for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateUserRequest:
      type: object
      required:
      - username
      - email
      - role
      - temporaryPassword
      properties:
        username:
          type: string
          description: 3-50 letters, digits, dots, underscores or hyphens after trimming;
            stored lowercase
        email:
          type: string
          description: Valid email, at most 254 characters after trimming; stored
            lowercase
        role:
          type: string
          enum:
          - USER
          - ADMIN
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: At most 72 UTF-8 bytes; do not trim or normalize
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
      required:
      - login
      - password
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: At most 72 UTF-8 bytes
      required:
      - currentPassword
      - newPassword
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: '#/components/schemas/UserResponse'
    DocumentResponse:
      type: object
      required:
      - id
      - title
      - originalFilename
      - contentType
      - sizeBytes
      - createdAt
      - updatedAt
      - categories
      properties:
        id:
          type: integer
          format: int64
        title: &id002
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; must not be blank
        description: &id003
          type:
          - string
          - 'null'
          maxLength: 255
        originalFilename:
          type: string
          maxLength: 255
        contentType:
          const: application/pdf
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        createdAt:
          type: string
          format: date-time
          description: UTC
        updatedAt:
          type: string
          format: date-time
          description: UTC
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
          description: Current assignments sorted by name; empty means Unclassified
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    MetadataRequest:
      type: object
      required:
      - title
      properties:
        title: *id002
        description: *id003
    UploadRequest:
      type: object
      required:
      - file
      - title
      properties:
        file:
          type: string
          format: binary
          description: Nonempty, parseable, unencrypted application/pdf; at most 10485760
            bytes and 1-50 pages
        title: *id002
        description: *id003
    DocumentPageResponse:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProcessingResponse:
      type: object
      required:
      - documentId
      - processingAvailable
      - ocr
      - indexing
      - summary
      - classification
      properties:
        documentId:
          type: integer
          format: int64
        processingAvailable:
          const: false
        ocr:
          const: NOT_STARTED
        indexing:
          const: NOT_STARTED
        summary:
          const: NOT_STARTED
        classification:
          const: NOT_STARTED
    UploadResponse:
      type: object
      required:
      - document
      - processingUrl
      - processing
      properties:
        document:
          $ref: '#/components/schemas/DocumentResponse'
        processingUrl:
          type: string
        processing:
          $ref: '#/components/schemas/ProcessingResponse'
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type:
          - string
          - 'null'
      required:
      - id
      - name
    CategoriesRequest:
      type: object
      required:
      - categoryIds
      properties:
        categoryIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: Known positive category IDs; empty array clears all assignments
